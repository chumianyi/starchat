name: Build StarChat APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    name: Build afat debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Install ccache
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache

      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ github.sha }}
          restore-keys: |
            ccache-

      - name: Configure ccache
        run: |
          ccache -M 600M
          ccache -o compression=true
          ccache -z

      - name: Build APK (all ABIs debug)
        run: |
          chmod +x ./gradlew
          ./gradlew :TMessagesProj_App:assembleAfatDebug -Puse_ccache --stacktrace

      - name: ccache stats
        run: ccache -s
        if: always()

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: StarChat-afat-debug
          path: TMessagesProj_App/build/outputs/apk/afat/debug/app.apk
          if-no-files-found: error
          retention-days: 30
